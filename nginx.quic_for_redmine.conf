server {
    listen 443 ssl;
    listen 443 quic reuseport;

    http2 on;
    http3 on;

    server_name redmine.local;

    ssl_certificate     /etc/nginx/ssl/redmine.crt;
    ssl_certificate_key /etc/nginx/ssl/redmine.key;

    # HTTP/3 requires TLS 1.3
    ssl_protocols TLSv1.3;

    # Advertise HTTP/3 to clients
    add_header Alt-Svc 'h3=":443"; ma=86400';
    add_header Alt-Svc 'h3-29=":443"; ma=86400';
    add_header X-HTTP3 $http3 always;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /cable {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_http_version 1.1;
        proxy_read_timeout 120;
        proxy_pass http://127.0.0.1:3000/cable;
    }
}


